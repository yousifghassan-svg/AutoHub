services:
  postgres:
    image: postgres:16-alpine
    container_name: autohub-postgres
    restart: unless-stopped
    ports:
      - "5433:5432"
    environment:
      POSTGRES_USER: autohub
      POSTGRES_PASSWORD: autohub
      POSTGRES_DB: autohub
    volumes:
      - autohub_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U autohub -d autohub"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: autohub-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - autohub_redis:/data

volumes:
  autohub_pg:
  autohub_redis:
